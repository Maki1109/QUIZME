<!doctype html>

<head>
<meta charset="utf-8" />
<title>QuizMe — sticker sheet (source)</title>
<!--
  Source artwork for the die-cut stickers used on the landing page.
  Every sticker is hand-drawn SVG; the white "kiss-cut" border is added by the #diecut filter.
  The landing page uses transparent WebP exports of these (FE/src/assets/stickers/*.webp).
  To change a sticker: edit it here, open this file in a browser to check it, then re-export each
  <figure data-name="…"> as a transparent image at 2× (any headless-browser screenshot of the element
  with a transparent background works).
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=IBM+Plex+Mono:wght@500;600;700&family=Playfair+Display:ital,wght@1,700;1,800&family=Sedgwick+Ave&display=swap" rel="stylesheet" />
<style>
  :root { --ink: #1B1512; --coral: #FF5E3A; --yellow: #FFC93C; --mint: #37D29A; --blue: #3B5BFF; --pink: #FF8AC6; --purple: #7C5CFF; --cream: #FFF4DC; }
  html, body { margin: 0; background: #123A2B; }
  body { display: flex; flex-wrap: wrap; gap: 24px; padding: 32px; align-items: center; }
  figure { margin: 0; line-height: 0; }
  svg { display: block; overflow: visible; }
  .block { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-stretch: 75%; }
  .mono { font-family: "IBM Plex Mono", monospace; font-weight: 600; }
  .hand { font-family: "Sedgwick Ave", cursive; }
  .serif { font-family: "Playfair Display", serif; font-style: italic; font-weight: 700; }
  .o { stroke: var(--ink); stroke-width: 5; stroke-linejoin: round; stroke-linecap: round; }
</style>
</head>
<body>

<!-- Shared filter: grows the artwork's silhouette into a smooth off-white border. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="diecut" x="-12%" y="-12%" width="124%" height="124%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4.6" result="blur" />
      <feComponentTransfer in="blur" result="mask"><feFuncA type="linear" slope="50" intercept="-3" /></feComponentTransfer>
      <feFlood flood-color="#FFFBF0" result="white" />
      <feComposite in="white" in2="mask" operator="in" result="border" />
      <feMerge><feMergeNode in="border" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>
</svg>

<script>
  // Star-burst: data-burst="cx,cy,outerR,innerR,spikes"
  document.querySelectorAll('[data-burst]').forEach((el) => {
    const [cx, cy, ro, ri, n] = el.dataset.burst.split(',').map(Number);
    const pts = [];
    for (let i = 0; i < n * 2; i += 1) {
      const r = i % 2 ? ri : ro;
      const a = (Math.PI * i) / n - Math.PI / 2;
      pts.push(`${(cx + r * Math.cos(a)).toFixed(1)},${(cy + r * Math.sin(a)).toFixed(1)}`);
    }
    el.setAttribute('points', pts.join(' '));
  });
  // Scalloped circle: data-scallop="cx,cy,r,bumps,depth"
  document.querySelectorAll('[data-scallop]').forEach((el) => {
    const [cx, cy, r, bumps, depth] = el.dataset.scallop.split(',').map(Number);
    let d = '';
    for (let i = 0; i <= 360; i += 1) {
      const t = (i / 360) * Math.PI * 2;
      const rr = r - depth / 2 + (depth / 2) * Math.cos(bumps * t);
      d += `${i ? 'L' : 'M'}${(cx + rr * Math.cos(t)).toFixed(2)} ${(cy + rr * Math.sin(t)).toFixed(2)}`;
    }
    el.setAttribute('d', `${d}Z`);
  });
</script>
